<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" fill="none">
  <style>
    .title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 700; font-size: 28px; fill: #00e5ff; }
    .subtitle { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 500; font-size: 16px; fill: #e0e0e0; }
    .username { font-family: 'Courier New', monospace; font-weight: bold; font-size: 14px; fill: #ff007f; letter-spacing: 1px; }
    .tag { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; fill: #00e5ff; font-weight: 600; }
    .tag-bg { fill: #0d1e3d; stroke: #00e5ff; stroke-width: 1px; }
    .card-bg { fill: url(#bg-gradient); stroke: #1e293b; stroke-width: 2px; }
    .grid-lines { stroke: #1e293b; stroke-width: 0.5px; opacity: 0.4; }
  </style>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="60%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <clipPath id="avatar-clip">
      <circle cx="85" cy="110" r="50" />
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="796" height="216" rx="16" class="card-bg" />

  <!-- Background Tech Grid Lines for Tech Aesthetic -->
  <g class="grid-lines">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="160" y1="0" x2="160" y2="220" />
    <line x1="320" y1="0" x2="320" y2="220" />
    <line x1="480" y1="0" x2="480" y2="220" />
    <line x1="640" y1="0" x2="640" y2="220" />
  </g>

  <!-- Glowing Effect around Avatar -->
  <circle cx="85" cy="110" r="54" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.8" />
  <circle cx="85" cy="110" r="58" fill="none" stroke="#ff007f" stroke-width="1.5" opacity="0.5" />
  
  <!-- Avatar Image -->
  <image href="https://avatars.githubusercontent.com/u/233955129?v=4" x="35" y="60" width="100" height="100" clip-path="url(#avatar-clip)" />

  <!-- Texts -->
  <text x="160" y="70" class="username">@CHAITANYA-KHANKE</text>
  <text x="160" y="108" class="title">Chaitanya Khanke</text>
  <text x="160" y="133" class="subtitle">Aspiring AI Engineer | B.Tech CSE @ GCOEC</text>

  <!-- Tags -->
  <g transform="translate(160, 155)">
    <rect x="0" y="0" width="70" height="24" rx="12" class="tag-bg" />
    <text x="35" y="16" text-anchor="middle" class="tag">PYTHON</text>
  </g>
  <g transform="translate(240, 155)">
    <rect x="0" y="0" width="115" height="24" rx="12" class="tag-bg" />
    <text x="57.5" y="16" text-anchor="middle" class="tag">MACHINE LEARNING</text>
  </g>
  <g transform="translate(365, 155)">
    <rect x="0" y="0" width="100" height="24" rx="12" class="tag-bg" />
    <text x="50" y="16" text-anchor="middle" class="tag">GENERATIVE AI</text>
  </g>
  <g transform="translate(475, 155)">
    <rect x="0" y="0" width="95" height="24" rx="12" class="tag-bg" />
    <text x="47.5" y="16" text-anchor="middle" class="tag">DATA SCIENCE</text>
  </g>

  <!-- Cyberpunk Graphic on Right -->
  <g transform="translate(700, 75)" stroke="#00e5ff" stroke-width="1.5" opacity="0.4">
    <circle cx="40" cy="40" r="30" fill="none" stroke-dasharray="4,4" />
    <circle cx="40" cy="40" r="15" fill="none" stroke="#ff007f" />
    <line x1="40" y1="0" x2="40" y2="80" />
    <line x1="0" y1="40" x2="80" y2="40" />
    <polygon points="40,10 45,40 40,70 35,40" fill="none" stroke="#00e5ff" />
  </g>
</svg>
